<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/cat-flight-32.png?v=3">
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/icons/cat-flight-64.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=cat-flight-2">
  <link rel="manifest" href="/site.webmanifest?v=travel-name">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="떠나보자">
  <meta name="theme-color" content="#58b7ed">
  <title>떠나보자 | 로그인</title>
  <link rel="stylesheet" href="../assets/login/login.css">
</head>
<body data-page="login" class="login-page">
  <main class="pass">
    <h1 class="sr-only">떠나보자! 우리 둘의 여행을 한곳에</h1>
    <picture class="art">
      <source media="(max-width: 700px)" srcset="../assets/login/journal.jpg">
      <img src="../assets/login/ticket.jpg" alt="">
    </picture>
    <section class="paper" aria-label="로그인">
      <form id="login-form" method="post">
        <label for="username">아이디</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="password">비밀번호</label>
        <div class="password-box">
          <input id="password" type="password" name="password" autocomplete="current-password" required>
          <button id="toggle-password" type="button" aria-label="비밀번호 표시" aria-pressed="false">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p id="login-error" role="alert" class="is-hidden"></p>
        <button class="submit" type="submit">로그인</button>
        <details class="reset"><summary>비밀번호 재설정</summary><p>이 여행 계정의 비밀번호를 잊었다면 계정 관리자에게 재설정을 요청해 주세요.</p></details>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="../assets/login/sign-in.js"></script>
  <script src="../assets/login/login-ui.js"></script>
</body>
</html>
