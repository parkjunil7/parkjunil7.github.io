<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJTG | 강릉 지출</title>
  <link rel="icon" type="image/png" sizes="32x32" href="jijun_favicon_32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="jijun_favicon_64.png">
  <script>
    (function () {
      const nextPath = window.location.pathname.split("/").pop() || "index.html";
      const projectRef = "wphdhiowhivefokivfql";
      const authKeys = [`sb-${projectRef}-auth-token`, "supabase.auth.token"];
      let hasSession = false;
      try {
        hasSession = authKeys.some((key) => {
          const value = window.localStorage.getItem(key);
          return typeof value === "string" && value.length > 0 && value !== "null";
        });
      } catch (_error) {
        hasSession = false;
      }
      if (!hasSession) {
        window.location.replace(`login.html?next=${encodeURIComponent(nextPath)}`);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="budget">
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"><img src="jijun_favicon_64.png" alt=""></span>
        <span>
          <strong>JJTG</strong>
          <small>강원도 강릉 여행</small>
        </span>
      </a>
      <nav class="nav">
        <a href="../index.html">세계지도</a>
        <a href="index.html">홈/개요</a>
        <a href="schedule.html">여행 일정표</a>
        <a href="records.html">여행 기록</a>
        <a href="budget.html">지출</a>
      </nav>
    </header>

    <main>
      <section class="page-header">
        <p class="eyebrow">Shared Budget</p>
        <h1>강릉 지출 정리</h1>
        <p>숙소, 교통, 식비 같은 여행 경비를 함께 기록하고 유형별로 묶어서 볼 수 있습니다.</p>
      </section>

      <section id="budget-setup-notice" class="panel setup-notice is-hidden">
        <div class="panel-head">
          <p class="eyebrow">Supabase Setup</p>
          <h2>지출용 테이블 생성 필요</h2>
        </div>
        <p class="setup-copy">
          Supabase에 <code>expenses</code> 테이블이 준비되면 강릉 지출도 바로 연결됩니다.
        </p>
      </section>

      <section class="grid budget-grid">
        <article class="panel">
          <div class="panel-head">
            <p class="eyebrow">Add Expense</p>
            <h2>지출 등록</h2>
          </div>
          <form id="budget-form" class="budget-form">
            <label class="form-field">
              <span>유형</span>
              <select name="category" required>
                <option value="">선택</option>
                <option value="숙소">숙소</option>
                <option value="교통">교통</option>
                <option value="식비">식비</option>
                <option value="카페">카페</option>
                <option value="기타">기타</option>
              </select>
            </label>

            <label class="form-field">
              <span>항목</span>
              <input type="text" name="title" placeholder="예: 씨마크 호텔" required>
            </label>

            <label class="form-field">
              <span>금액</span>
              <input type="number" name="amount" placeholder="예: 320000" min="0" step="100" required>
            </label>

            <button type="submit" class="button primary budget-submit">지출 추가</button>
          </form>
        </article>

        <article class="panel">
          <div class="panel-head">
            <p class="eyebrow">Summary</p>
            <h2>예산 요약</h2>
          </div>
          <div class="budget-total-card">
            <span>총 지출</span>
            <strong id="budget-total">₩0</strong>
          </div>
          <div class="budget-total-card budget-total-card-muted">
            <span>1인 기준</span>
            <strong id="budget-per-person">₩0</strong>
          </div>
          <div id="budget-summary" class="budget-summary"></div>
        </article>
      </section>

      <section class="panel schedule-toolbar">
        <div>
          <p class="eyebrow">Expense Item</p>
          <h2>등록된 지출</h2>
        </div>
        <button type="button" id="budget-reset" class="button secondary budget-reset">전체 초기화</button>
      </section>

      <section id="budget-items" class="budget-items"></section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js?v=20260624-gangneung-launch"></script>
</body>
</html>
