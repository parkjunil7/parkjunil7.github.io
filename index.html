<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJTG | Archive</title>
  <link rel="icon" type="image/png" sizes="32x32" href="jijun_favicon_32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="jijun_favicon_64.png">
  <style>
    :root {
      --sea-top: #def4f8;
      --sea-bottom: #edf8fb;
      --land: #bdbdbf;
      --land-stroke: rgba(74, 88, 100, 0.12);
      --trip-fill: #f6b264;
      --trip-stroke: #ee6c3f;
      --trip-shadow: rgba(239, 108, 63, 0.22);
      --trip-fill-alt: #8fd6e0;
      --trip-stroke-alt: #257891;
      --trip-shadow-alt: rgba(37, 120, 145, 0.2);
      --panel: rgba(255, 255, 255, 0.92);
      --panel-line: rgba(13, 99, 127, 0.12);
      --text: #203040;
      --muted: #698091;
      --accent: #0d637f;
      --accent-soft: #d8eef3;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      overflow: hidden;
      font-family: "Noto Sans KR", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(110, 214, 221, 0.28), transparent 24%),
        radial-gradient(circle at right 18%, rgba(13, 99, 127, 0.12), transparent 18%),
        linear-gradient(180deg, #f7fbfc 0%, #eef6f8 100%);
    }

    .map-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(180deg, var(--sea-top) 0%, var(--sea-bottom) 100%);
    }

    #world-map {
      width: 100%;
      height: 100%;
      display: block;
    }

    .sphere {
      fill: rgba(255, 255, 255, 0.45);
      stroke: rgba(40, 53, 63, 0.9);
      stroke-width: 1.2;
    }

    .country {
      fill: var(--land);
      stroke: var(--land-stroke);
      stroke-width: 0.55;
      vector-effect: non-scaling-stroke;
      transition: fill 0.18s ease, opacity 0.18s ease;
    }

    .country.trip {
      fill: var(--trip-fill);
      stroke: var(--trip-stroke);
      stroke-width: 1.6;
      filter: drop-shadow(0 14px 22px var(--trip-shadow));
      cursor: pointer;
    }

    .country.trip.secondary {
      fill: var(--trip-fill-alt);
      stroke: var(--trip-stroke-alt);
      filter: drop-shadow(0 14px 22px var(--trip-shadow-alt));
    }

    .country.trip:hover,
    .country.trip.is-active {
      fill: #f8be79;
    }

    .country.trip.secondary:hover,
    .country.trip.secondary.is-active {
      fill: #a7e0e7;
    }

    .intro-chip {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 3;
      padding: 12px 16px;
      border: 1px solid var(--panel-line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      color: var(--accent);
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 34px rgba(31, 59, 78, 0.08);
    }

    .archive-panel {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 4;
      width: min(420px, 100vw);
      height: 100%;
      padding: 28px 22px 24px;
      border-left: 1px solid var(--panel-line);
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: -18px 0 40px rgba(31, 59, 78, 0.08);
      transform: translateX(100%);
      transition: transform 0.34s ease;
      overflow-y: auto;
    }

    .archive-panel.is-open {
      transform: translateX(0);
    }

    .panel-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .panel-kicker {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .panel-title {
      margin: 0;
      color: var(--text);
      font-size: 2rem;
      line-height: 1;
    }

    .panel-copy {
      margin-top: 28px;
      padding: 22px 20px;
      border: 1px solid rgba(13, 99, 127, 0.12);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(235, 248, 250, 0.9), rgba(255, 255, 255, 0.96));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .panel-copy strong {
      display: block;
      color: var(--text);
      font-size: 1.25rem;
      line-height: 1.5;
    }

    .panel-copy span {
      display: block;
      margin-top: 10px;
      color: var(--accent);
      font-size: 0.96rem;
      font-weight: 700;
    }

    .panel-copy .archive-stop {
      display: block;
    }

    .panel-copy .archive-stop + .archive-stop {
      margin-top: 22px;
    }

    .panel-copy .archive-place {
      display: block;
      color: var(--text);
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.5;
    }

    .panel-copy .archive-period {
      display: block;
      margin-top: 8px;
      color: var(--accent);
      font-size: 0.96rem;
      font-weight: 700;
    }

    .panel-copy a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      padding: 11px 16px;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-weight: 700;
    }

    @media (max-width: 980px) {
      .intro-chip {
        top: 12px;
        left: 12px;
        font-size: 0.82rem;
      }

      .archive-panel {
        width: 100%;
        padding: 18px 16px 24px;
      }

      .panel-title {
        font-size: 1.7rem;
      }

      .panel-copy {
        margin-top: 22px;
        padding: 18px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="map-shell">
    <div class="intro-chip">JJTG ARCHIVE</div>
    <svg id="world-map" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="세계지도"></svg>

    <aside id="archive-panel" class="archive-panel" aria-label="중국 여행 아카이브">
      <div class="panel-top">
        <div>
          <p class="panel-kicker">Country Archive</p>
          <h2 id="panel-title" class="panel-title">China</h2>
        </div>
        <button id="panel-close" class="panel-close" type="button" aria-label="패널 닫기">×</button>
      </div>
      <div id="panel-copy" class="panel-copy">
        <strong>쿤밍, 리장, 샹그릴라</strong>
        <span>2026.04.30 - 2026.05.06</span>
        <a href="./china-2026/index.html">사이트 이동</a>
      </div>

    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script>
    const ARCHIVE_COUNTRIES = {
      "156": {
        title: "China",
        href: "./china-2026/index.html",
        className: "",
        summary: "쿤밍, 리장, 샹그릴라",
        date: "2026.04.30 - 2026.05.06"
      },
      "410": {
        title: "Korea",
        href: "#",
        className: "secondary",
        summary: `
          <span class="archive-stop">
            <span class="archive-place">경상북도 경주</span>
            <span class="archive-period">2026.03.06 - 03.07</span>
          </span>
          <span class="archive-stop">
            <span class="archive-place">강원도 영월</span>
            <span class="archive-period">2026.04.04 - 04.05</span>
          </span>
          <span class="archive-stop">
            <span class="archive-place">제주도</span>
            <span class="archive-period">2026.06.03 - 06.06</span>
          </span>
          <a href="./jeju-2026/index.html">사이트 이동</a>
        `,
        date: ""
      }
    };

    const svg = d3.select("#world-map");
    const panel = document.getElementById("archive-panel");
    const panelTitle = document.getElementById("panel-title");
    const panelCopy = document.getElementById("panel-copy");
    const closeButton = document.getElementById("panel-close");
    const width = 1600;
    const height = 900;

    const projection = d3.geoNaturalEarth1()
      .fitExtent([[4, 4], [width - 4, height - 4]], { type: "Sphere" });
    const path = d3.geoPath(projection);

    svg.append("path")
      .datum({ type: "Sphere" })
      .attr("class", "sphere")
      .attr("d", path);

    let activeCountryPath = null;

    fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
      .then((response) => response.json())
      .then((world) => {
        const countries = topojson.feature(world, world.objects.countries).features;

        const selection = svg.append("g")
          .selectAll("path")
          .data(countries)
          .join("path")
          .attr("class", (d) => {
            const archive = ARCHIVE_COUNTRIES[String(d.id)];
            if (!archive) {
              return "country";
            }
            return `country trip ${archive.className}`.trim();
          })
          .attr("d", path)
          .on("click", (event, d) => {
            event.stopPropagation();

            const archive = ARCHIVE_COUNTRIES[String(d.id)];

            if (!archive) {
              closeArchive();
              return;
            }

            activeCountryPath = event.currentTarget;
            openArchive(archive);
          });
      });

    document.body.addEventListener("click", (event) => {
      if (panel.contains(event.target)) {
        return;
      }

      closeArchive();
    });

    closeButton.addEventListener("click", () => {
      closeArchive();
    });

    function openArchive(archive) {
      panelTitle.textContent = archive.title;

      if (archive.date) {
        panelCopy.innerHTML = `
          <strong>${archive.summary}</strong>
          <span>${archive.date}</span>
          <a href="${archive.href}">사이트 이동</a>
        `;
      } else {
        panelCopy.innerHTML = archive.summary;
      }

      panel.classList.add("is-open");
      if (activeCountryPath) {
        activeCountryPath.classList.add("is-active");
      }
    }

    function closeArchive() {
      panel.classList.remove("is-open");
      if (activeCountryPath) {
        activeCountryPath.classList.remove("is-active");
      }
    }
  </script>
</body>
</html>
