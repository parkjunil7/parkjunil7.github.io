<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/cat-flight-32.png?v=3">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icons/cat-flight-64.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=cat-flight-2">
  <link rel="manifest" href="/site.webmanifest?v=travel-name">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="떠나보자">
  <meta name="theme-color" content="#58b7ed">
  <title>떠나보자 | Archive</title>
  <script>
    (function () {
      const nextPath = window.location.pathname.split("/").pop() || "index.html";
      const projectRef = "wphdhiowhivefokivfql";
      const authKeys = [`sb-${projectRef}-auth-token`, "supabase.auth.token"];
      let hasSession = false;

      try {
        hasSession = authKeys.some((key) => {
          const value = window.localStorage.getItem(key);
          return typeof value === "string" && value.length > 0 && value !== "null";
        });
      } catch (_error) {
        hasSession = false;
      }

      if (!hasSession) {
        window.location.replace(`login.html?next=${encodeURIComponent(nextPath)}`);
        return;
      }

      document.documentElement.classList.add("auth-pending");
    })();
  </script>
  <style>
    html.auth-pending body[data-page="home"] {
      visibility: hidden;
    }

    :root {
      --sea-top: #def4f8;
      --sea-bottom: #edf8fb;
      --land: #bdbdbf;
      --land-stroke: rgba(74, 88, 100, 0.12);
      --trip-fill: #f6b264;
      --trip-stroke: #ee6c3f;
      --trip-shadow: rgba(239, 108, 63, 0.22);
      --trip-fill-alt: #8fd6e0;
      --trip-stroke-alt: #257891;
      --trip-shadow-alt: rgba(37, 120, 145, 0.2);
      --panel: rgba(255, 255, 255, 0.92);
      --panel-line: rgba(13, 99, 127, 0.12);
      --text: #203040;
      --muted: #698091;
      --accent: #0d637f;
      --accent-soft: #d8eef3;
      --card-shadow: 0 18px 34px rgba(31, 59, 78, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      overflow: hidden;
      font-family: "Noto Sans KR", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(110, 214, 221, 0.28), transparent 24%),
        radial-gradient(circle at right 18%, rgba(13, 99, 127, 0.12), transparent 18%),
        linear-gradient(180deg, #f7fbfc 0%, #eef6f8 100%);
    }

    .map-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(180deg, var(--sea-top) 0%, var(--sea-bottom) 100%);
    }

    #world-map {
      width: 100%;
      height: 100%;
      display: block;
    }

    .sphere {
      fill: rgba(255, 255, 255, 0.45);
      stroke: rgba(40, 53, 63, 0.9);
      stroke-width: 1.2;
    }

    .country {
      fill: var(--land);
      stroke: var(--land-stroke);
      stroke-width: 0.55;
      vector-effect: non-scaling-stroke;
      transition: fill 0.18s ease, opacity 0.18s ease;
    }

    .country.trip {
      fill: var(--trip-fill);
      stroke: var(--trip-stroke);
      stroke-width: 1.6;
      filter: drop-shadow(0 14px 22px var(--trip-shadow));
      cursor: pointer;
    }

    .country.trip.secondary {
      fill: var(--trip-fill-alt);
      stroke: var(--trip-stroke-alt);
      filter: drop-shadow(0 14px 22px var(--trip-shadow-alt));
    }

    .country.trip:hover,
    .country.trip.is-active {
      fill: #f8be79;
    }

    .country.trip.secondary:hover,
    .country.trip.secondary.is-active {
      fill: #a7e0e7;
    }

    .intro-chip {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 3;
      padding: 12px 16px;
      border: 1px solid var(--panel-line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      color: var(--accent);
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      backdrop-filter: blur(10px);
      box-shadow: var(--card-shadow);
    }

    .archive-panel {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 4;
      width: min(420px, 100vw);
      height: 100%;
      padding: 28px 22px 24px;
      border-left: 1px solid var(--panel-line);
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: -18px 0 40px rgba(31, 59, 78, 0.08);
      transform: translateX(100%);
      transition: transform 0.34s ease;
      overflow-y: auto;
    }

    .archive-panel.is-open {
      transform: translateX(0);
    }

    .panel-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .panel-kicker {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .panel-title {
      margin: 0;
      color: var(--text);
      font-size: 2rem;
      line-height: 1;
    }

    .panel-close {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(13, 99, 127, 0.22);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
    }

    .panel-copy {
      margin-top: 28px;
      padding: 22px 20px;
      border: 1px solid rgba(13, 99, 127, 0.12);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(235, 248, 250, 0.9), rgba(255, 255, 255, 0.96));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .panel-copy strong {
      display: block;
      color: var(--text);
      font-size: 1.25rem;
      line-height: 1.5;
    }

    .panel-copy span {
      display: block;
      margin-top: 10px;
      color: var(--accent);
      font-size: 0.96rem;
      font-weight: 700;
    }

    .panel-copy .archive-stop {
      display: block;
    }

    .panel-copy .archive-stop + .archive-stop {
      margin-top: 22px;
    }

    .panel-copy .archive-place {
      display: block;
      color: var(--text);
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.5;
    }

    .panel-copy .archive-period {
      display: block;
      margin-top: 8px;
      color: var(--accent);
      font-size: 0.96rem;
      font-weight: 700;
    }

    .panel-copy a,
    .mobile-card-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      padding: 11px 16px;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-weight: 700;
    }

    .mobile-archive {
      display: none;
    }

    .mobile-archive-header h1 {
      margin: 14px 0 10px;
      font-size: clamp(2.15rem, 9vw, 3.2rem);
      line-height: 0.98;
      letter-spacing: -0.04em;
    }

    .mobile-archive-header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .mobile-archive-list {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }

    .mobile-card {
      padding: 18px 18px 20px;
      border: 1px solid var(--panel-line);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--card-shadow);
    }

    .mobile-card-kind {
      display: inline-flex;
      align-items: center;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(13, 99, 127, 0.08);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .mobile-card h2 {
      margin: 14px 0 0;
      font-size: 1.4rem;
      line-height: 1.25;
    }

    .mobile-card-date {
      margin-top: 10px;
      color: var(--accent);
      font-size: 0.96rem;
      font-weight: 700;
    }

    .mobile-card-route {
      margin-top: 14px;
      color: var(--muted);
      line-height: 1.65;
    }

    .mobile-card-note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.65;
    }

    .mobile-card-action.is-disabled {
      background: rgba(13, 99, 127, 0.1);
      color: var(--accent);
      pointer-events: none;
    }

    @media (max-width: 980px) {
      body {
        overflow: auto;
        overflow-x: hidden;
      }

      .map-shell {
        width: 100%;
        min-height: 100vh;
        height: auto;
        padding: 84px 14px 28px;
      }

      .intro-chip {
        top: 12px;
        left: 12px;
        font-size: 0.82rem;
      }

      #world-map,
      .archive-panel {
        display: none;
      }

      .mobile-archive {
        display: block;
        width: 100%;
        max-width: 100%;
      }

      .mobile-archive-header,
      .mobile-archive-list,
      .mobile-card {
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>
<body data-page="home">
  <div class="map-shell">
    <div class="intro-chip">떠나보자 ARCHIVE</div>

    <div class="mobile-archive">
      <div class="mobile-archive-header">
        <h1>여행기록</h1>
        <p><span data-member-text="indexText10"></span></p>
      </div>
      <section id="mobile-archive-list" class="mobile-archive-list" aria-label="모바일 여행 목록"></section>
    </div>

    <svg id="world-map" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="세계지도"></svg>

    <aside id="archive-panel" class="archive-panel" aria-label="여행 아카이브 패널">
      <div class="panel-top">
        <div>
          <p class="panel-kicker">Country Archive</p>
          <h2 id="panel-title" class="panel-title">China</h2>
        </div>
        <button id="panel-close" class="panel-close" type="button" aria-label="패널 닫기">×</button>
      </div>
      <div id="panel-copy" class="panel-copy">
        <strong>쿤밍, 리장, 샹그릴라</strong>
        <span><span data-member-text="chinaPeriod"></span></span>
        <a href="./china/index.html">사이트 이동</a>
      </div>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script src="assets/member-page.js?v=jjtg-20261119" data-trip="archive"></script>
</body>
</html>
